<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cade.is cool</title>
    <style>
      :root {
        --bg: #000000;
        --panel: #111111;
        --panel-soft: #181818;
        --grid: rgba(255, 255, 255, 0.045);
        --line: rgba(255, 255, 255, 0.12);
        --yellow: #f3d350;
        --orange: #f97316;
        --player: #ef4444; /* Vivid Red Player */
        --text: #f4f4f4;
        --muted: rgba(255, 255, 255, 0.72);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        overflow-x: hidden;
      }

      #arcade-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        pointer-events: none;
      }

      .topbar, .main, #arcade-hud {
        position: relative;
        z-index: 10;
      }

      .topbar {
        width: 100%;
        height: 104px;
        background: #0c0c0c;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px 0 24px;
      }

      .brand {
        color: var(--yellow);
        text-decoration: none;
        font-size: clamp(2.2rem, 4vw, 4rem);
        line-height: 1;
        letter-spacing: -0.08em;
        font-weight: 800;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .nav a,
      .nav button {
        appearance: none;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        text-decoration: none;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-transform: lowercase;
        padding: 10px 14px;
        border-radius: 999px;
        cursor: pointer;
        transition: border-color 0.15s ease, color 0.15s ease;
      }

      .nav a:hover,
      .nav button:hover {
        border-color: rgba(243, 211, 80, 0.5);
        color: var(--yellow);
      }

      .nav .account {
        color: var(--yellow);
        border-color: rgba(243, 211, 80, 0.45);
      }

      .main {
        min-height: calc(100vh - 104px);
        background: linear-gradient(180deg, var(--panel-soft) 0%, var(--panel) 100%);
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 32px 32px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 52px 24px 80px;
      }

      .content {
        width: min(100%, 980px);
      }

      .hero {
        text-align: center;
      }

      h1 {
        margin: 0;
        color: var(--yellow);
        font-size: clamp(3rem, 7vw, 8rem);
        line-height: 0.9;
        letter-spacing: -0.08em;
        font-weight: 800;
      }

      .subtitle {
        margin: 18px auto 0;
        max-width: 700px;
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
      }

      .projects-section {
        margin-top: 72px;
        width: min(100%, 500px);
        text-align: left;
      }

      .projects-section h2 {
        margin: 0 0 18px;
        color: var(--yellow);
        font-size: clamp(1.6rem, 2.5vw, 2.6rem);
        letter-spacing: -0.05em;
        line-height: 1.1;
        font-weight: 800;
      }

      .project-button {
        display: inline-block;
        padding: 16px 22px;
        border: 1px solid rgba(255, 99, 99, 0.7);
        background: rgba(239, 68, 68, 0.12);
        color: #ffd8d8;
        text-decoration: none;
        border-radius: 12px;
        font-size: 1.05rem;
        font-weight: 700;
        transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }

      .project-button:hover {
        transform: translateY(-1px);
        background: rgba(239, 68, 68, 0.18);
        border-color: rgba(255, 99, 99, 1);
      }

      #arcade-hud {
        position: fixed;
        bottom: 16px;
        right: 16px;
        font-family: monospace;
        font-size: 12px;
        color: var(--player);
        background: rgba(12, 12, 12, 0.9);
        border: 1px solid var(--line);
        padding: 6px 12px;
        border-radius: 6px;
        display: block; /* Visible hint so you know it's loaded */
        pointer-events: none;
        letter-spacing: 0.05em;
        opacity: 0.7;
      }

      @media (max-width: 680px) {
        .topbar {
          height: auto;
          flex-direction: column;
          justify-content: center;
          gap: 12px;
          padding: 18px 16px;
        }

        .nav {
          justify-content: center;
        }

        .projects-section {
          margin-top: 56px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="arcade-bg"></canvas>
    <div id="arcade-hud">PRESS [ TO PLAY</div>

    <header class="topbar">
      <a href="index.html" class="brand">cade.is cool</a>

      <nav class="nav" aria-label="Main navigation">
        <a href="index.html">home</a>
        <a href="about.html">about me</a>
        <a href="terms.html">terms of service</a>
        <button class="account" type="button" aria-label="Account">account</button>
      </nav>
    </header>

    <main class="main">
      <div class="content">
        <div class="hero">
          <h1>cade.is cool</h1>
          <p class="subtitle">
            welcome to my stupid website. still working on adding more projects, but tell your friends about this
          </p>
        </div>

        <section class="projects-section" aria-label="Projects section">
          <h2>explore projects</h2>
          <a class="project-button" href="clarinet.cade.html" target="_blank" rel="noopener noreferrer">clarinet.cade</a>
        </section>
      </div>
    </main>

    <script>
      (function () {
        const canvas = document.getElementById('arcade-bg');
        const ctx = canvas.getContext('2d');
        const hud = document.getElementById('arcade-hud');

        let dpr = window.devicePixelRatio || 1;
        let width = window.innerWidth;
        let height = window.innerHeight;

        function resize() {
          dpr = window.devicePixelRatio || 1;
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        let running = false;
        let score = 0;
        let animId = null;

        const player = {
          x: width / 2,
          y: height / 2,
          size: 18,
          speed: 5.5
        };

        const keys = {};
        const threats = [];
        const threatColors = ['#f3d350', '#f97316', '#ffffff']; // Yellow, Orange, White

        function clearKeys() {
          for (let k in keys) delete keys[k];
        }

        function resetGame() {
          clearKeys();
          player.x = width / 2;
          player.y = height / 2;
          threats.length = 0;
          score = 0;
          hud.style.opacity = '1';
          hud.textContent = `SCORE: 0 // [ TO EXIT`;
        }

        function stopGame(msg) {
          running = false;
          clearKeys();
          if (animId) cancelAnimationFrame(animId);
          animId = null;
          ctx.clearRect(0, 0, width, height);
          hud.style.opacity = '0.7';
          hud.textContent = msg || `PRESS [ TO PLAY`;
        }

        // Universal trigger supporting e.key '[' and e.code 'BracketLeft'
        function isToggleKey(e) {
          return e.key === '[' || e.key === ']' || e.code === 'BracketLeft' || e.code === 'BracketRight';
        }

        window.addEventListener('keydown', (e) => {
          if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;

          if (isToggleKey(e)) {
            e.preventDefault();
            if (running) {
              stopGame(`PAUSED // PRESS [ TO RESUME`);
            } else {
              running = true;
              resetGame();
              loop();
            }
            return;
          }

          if (running) {
            const k = e.key.toLowerCase();
            keys[k] = true;
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(k)) {
              e.preventDefault();
            }
          }
        }, { passive: false });

        window.addEventListener('keyup', (e) => {
          keys[e.key.toLowerCase()] = false;
        });

        window.addEventListener('blur', () => {
          if (running) stopGame(`PAUSED // PRESS [ TO RESUME`);
        });

        function spawnThreat() {
          const side = Math.floor(Math.random() * 4);
          let tx, ty;
          if (side === 0) { tx = Math.random() * width; ty = -35; }
          else if (side === 1) { tx = width + 35; ty = Math.random() * height; }
          else if (side === 2) { tx = Math.random() * width; ty = height + 35; }
          else { tx = -35; ty = Math.random() * height; }

          threats.push({
            x: tx,
            y: ty,
            size: 11 + Math.random() * 9,
            speed: 2.2 + Math.random() * 1.5 + Math.min(score / 350, 4.5),
            color: threatColors[Math.floor(Math.random() * threatColors.length)]
          });
        }

        function checkCollision(px, py, pSize, tx, ty, tSize) {
          const pHalf = pSize / 2;
          const tHalf = tSize / 2;
          return (
            Math.abs(px - tx) < (pHalf + tHalf) &&
            Math.abs(py - ty) < (pHalf + tHalf)
          );
        }

        function loop() {
          if (!running) return;

          score += 0.16;
          hud.textContent = `SCORE: ${Math.floor(score)} // [ TO EXIT`;

          ctx.clearRect(0, 0, width, height);

          // Player movement
          let vx = 0;
          let vy = 0;
          if (keys['arrowup'] || keys['w']) vy -= player.speed;
          if (keys['arrowdown'] || keys['s']) vy += player.speed;
          if (keys['arrowleft'] || keys['a']) vx -= player.speed;
          if (keys['arrowright'] || keys['d']) vx += player.speed;

          if (vx !== 0 && vy !== 0) {
            vx *= 0.7071;
            vy *= 0.7071;
          }

          player.x += vx;
          player.y += vy;

          const halfP = player.size / 2;
          player.x = Math.max(halfP, Math.min(width - halfP, player.x));
          player.y = Math.max(halfP, Math.min(height - halfP, player.y));

          // Spawn rate
          if (Math.random() < 0.045 + Math.min(score / 6000, 0.035)) {
            spawnThreat();
          }

          // Update & draw homing threats
          for (let i = threats.length - 1; i >= 0; i--) {
            const t = threats[i];

            const angle = Math.atan2(player.y - t.y, player.x - t.x);
            t.x += Math.cos(angle) * t.speed;
            t.y += Math.sin(angle) * t.speed;

            if (checkCollision(player.x, player.y, player.size, t.x, t.y, t.size)) {
              stopGame(`GAME OVER // PRESS [ TO PLAY AGAIN`);
              return;
            }

            ctx.beginPath();
            ctx.arc(t.x, t.y, t.size / 2, 0, Math.PI * 2);
            ctx.fillStyle = t.color;
            ctx.fill();
          }

          // Draw player
          ctx.beginPath();
          ctx.arc(player.x, player.y, player.size / 2, 0, Math.PI * 2);
          ctx.fillStyle = '#ef4444';
          ctx.fill();

          animId = requestAnimationFrame(loop);
        }
      })();
    </script>
  </body>
</html>
