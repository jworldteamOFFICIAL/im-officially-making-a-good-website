<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cade.is cool</title>
    <style>
      :root {
        --bg: #000000;
        --panel: #121212;
        --line: rgba(255, 255, 255, 0.12);
        --yellow: #f3d350;
        --text: #f4f4f4;
        --muted: rgba(255, 255, 255, 0.72);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
      }

      .topbar {
        width: 100%;
        height: 104px;
        background: #0c0c0c;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px 0 24px;
      }

      .brand {
        color: var(--yellow);
        text-decoration: none;
        font-size: clamp(2.2rem, 4vw, 4rem);
        line-height: 1;
        letter-spacing: -0.08em;
        font-weight: 800;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .nav a,
      .nav button {
        appearance: none;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        text-decoration: none;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-transform: lowercase;
        padding: 10px 14px;
        border-radius: 999px;
        cursor: pointer;
        transition: border-color 0.15s ease, color 0.15s ease;
      }

      .nav a:hover,
      .nav button:hover {
        border-color: rgba(243, 211, 80, 0.5);
        color: var(--yellow);
      }

      .nav .account {
        color: var(--yellow);
        border-color: rgba(243, 211, 80, 0.45);
      }

      .page {
        min-height: calc(100vh - 104px);
        background: black;
      }

      .blank {
        min-height: calc(100vh - 104px);
      }

      @media (max-width: 680px) {
        .topbar {
          height: auto;
          flex-direction: column;
          justify-content: center;
          gap: 12px;
          padding: 18px 16px;
        }

        .nav {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a href="index.html" class="brand">cade.is cool</a>

      <nav class="nav" aria-label="Main navigation">
        <a href="index.html">home</a>
        <a href="about.html">about me</a>
        <a href="terms.html">terms of service</a>
        <button class="account" type="button" aria-label="Account">account</button>
      </nav>
    </header>

    <main class="page">
      <div class="blank" aria-label="Homepage blank section"></div>
    </main>
  </body>
</html>
