<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cade.is cool</title>
    <style>
      :root {
        --bg: #000000;
        --bar: #0a0a0a;
        --line: rgba(255, 255, 255, 0.12);
        --yellow: #f5d742;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--yellow);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .topbar {
        height: 58px;
        border-bottom: 1px solid var(--line);
        background: var(--bar);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
      }

      .topbar .brand {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: lowercase;
        color: var(--yellow);
      }

      .main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 30px 20px;
      }

      .title {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 8rem);
        line-height: 0.9;
        letter-spacing: -0.08em;
        font-weight: 800;
        text-align: center;
        color: var(--yellow);
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">cade.is cool</div>
    </header>

    <main class="main">
      <h1 class="title">cade.is cool</h1>
    </main>
  </body>
</html>
