<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cade.is cool</title>
    <style>
      :root {
        --bg: #000000;
        --panel: #111111;
        --panel-soft: #181818;
        --grid: rgba(255, 255, 255, 0.045);
        --line: rgba(255, 255, 255, 0.12);
        --yellow: #f3d350;
        --orange: #f97316;
        --text: #f4f4f4;
        --muted: rgba(255, 255, 255, 0.72);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        overflow-x: hidden;
      }

      /* Fixed background arcade canvas sits behind everything */
      #arcade-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        pointer-events: none;
      }

      /* Elevate interactive UI above canvas */
      .topbar, .main, #arcade-hud {
        position: relative;
        z-index: 10;
      }

      .topbar {
        width: 100%;
        height: 104px;
        background: #0c0c0c;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px 0 24px;
      }

      .brand {
        color: var(--yellow);
        text-decoration: none;
        font-size: clamp(2.2rem, 4vw, 4rem);
        line-height: 1;
        letter-spacing: -0.08em;
        font-weight: 800;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .nav a,
      .nav button {
        appearance: none;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        text-decoration: none;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-transform: lowercase;
        padding: 10px 14px;
        border-radius: 999px;
        cursor: pointer;
        transition: border-color 0.15s ease, color 0.15s ease;
      }

      .nav a:hover,
      .nav button:hover {
        border-color: rgba(243, 211, 80, 0.5);
        color: var(--yellow);
      }

      .nav .account {
        color: var(--yellow);
        border-color: rgba(243, 211, 80, 0.45);
      }

      .main {
        min-height: calc(100vh - 104px);
        background: linear-gradient(180deg, var(--panel-soft) 0%, var(--panel) 100%);
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 32px 32px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 52px 24px 80px;
      }

      .content {
        width: min(100%, 980px);
        text-align: center;
      }

      h1 {
        margin: 0;
        color: var(--yellow);
        font-size: clamp(3rem, 7vw, 8rem);
        line-height: 0.9;
        letter-spacing: -0.08em;
        font-weight: 800;
      }

      .subtitle {
        margin: 18px auto 0;
        max-width: 700px;
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
      }

      #arcade-hud {
        position: fixed;
        bottom: 16px;
        right: 16px;
        font-family: monospace;
        font-size: 12px;
        color: var(--yellow);
        background: rgba(12, 12, 12, 0.88);
        border: 1px solid var(--line);
        padding: 6px 12px;
        border-radius: 6px;
        display: none;
        pointer-events: none;
        letter-spacing: 0.05em;
      }

      @media (max-width: 680px) {
        .topbar {
          height: auto;
          flex-direction: column;
          justify-content: center;
          gap: 12px;
          padding: 18px 16px;
        }

        .nav {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="arcade-bg"></canvas>
    <div id="arcade-hud">SCORE: 0 // [ TO EXIT</div>

    <header class="topbar">
      <a href="index.html" class="brand">cade.is cool</a>

      <nav class="nav" aria-label="Main navigation">
        <a href="index.html">home</a>
        <a href="about.html">about me</a>
        <a href="terms.html">terms of service</a>
        <button class="account" type="button" aria-label="Account">account</button>
      </nav>
    </header>

    <main class="main">
      <div class="content">
        <h1>cade.is cool</h1>
        <p class="subtitle">
          welcome to my stupid website. still working on adding more projects, but tell your friends about this
        </p>
      </div>
    </main>

    <script>
      const canvas = document.getElementById('arcade-bg');
      const ctx = canvas.getContext('2d');
      const hud = document.getElementById('arcade-hud');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      let running = false;
      let score = 0;
      let animId = null;

      const player = {
        x: width / 2,
        y: height / 2,
        size: 16,
        speed: 5.5,
        vx: 0,
        vy: 0
      };

      const keys = {};
      const threats = [];
      const threatColors = ['#f3d350', '#f97316', '#ffffff']; // Yellow, Orange, White

      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

        if (e.key === '[') {
          e.preventDefault();
          running = !running;
          if (running) {
            player.x = width / 2;
            player.y = height / 2;
            player.vx = 0;
            player.vy = 0;
            threats.length = 0;
            score = 0;
            hud.style.display = 'block';
            hud.textContent = `SCORE: 0 // [ TO EXIT`;
            loop();
          } else {
            hud.style.display = 'none';
            cancelAnimationFrame(animId);
            ctx.clearRect(0, 0, width, height);
          }
          return;
        }

        if (running) {
          keys[e.key.toLowerCase()] = true;
        }
      });

      window.addEventListener('keyup', (e) => {
        if (running) {
          keys[e.key.toLowerCase()] = false;
        }
      });

      function spawnThreat() {
        const side = Math.floor(Math.random() * 4);
        let tx, ty, vx, vy;
        const spd = 2.2 + Math.random() * 3.2 + score / 350;

        if (side === 0) { tx = Math.random() * width; ty = -24; }
        else if (side === 1) { tx = width + 24; ty = Math.random() * height; }
        else if (side === 2) { tx = Math.random() * width; ty = height + 24; }
        else { tx = -24; ty = Math.random() * height; }

        const angle = Math.atan2(player.y - ty, player.x - tx) + (Math.random() - 0.5) * 0.45;
        vx = Math.cos(angle) * spd;
        vy = Math.sin(angle) * spd;

        threats.push({
          x: tx,
          y: ty,
          size: 9 + Math.random() * 11,
          vx: vx,
          vy: vy,
          color: threatColors[Math.floor(Math.random() * threatColors.length)]
        });
      }

      function loop() {
        if (!running) return;

        score += 0.16;
        hud.textContent = `SCORE: ${Math.floor(score)} // [ TO EXIT`;

        // Clear transparent so your CSS background grid shows through
        ctx.clearRect(0, 0, width, height);

        // Player update (WASD / Arrows)
        player.vx = 0;
        player.vy = 0;
        if (keys['arrowup'] || keys['w']) player.vy -= player.speed;
        if (keys['arrowdown'] || keys['s']) player.vy += player.speed;
        if (keys['arrowleft'] || keys['a']) player.vx -= player.speed;
        if (keys['arrowright'] || keys['d']) player.vx += player.speed;

        player.x = Math.max(player.size, Math.min(width - player.size, player.x + player.vx));
        player.y = Math.max(player.size, Math.min(height - player.size, player.y + player.vy));

        if (Math.random() < 0.055) spawnThreat();

        for (let i = threats.length - 1; i >= 0; i--) {
          const t = threats[i];
          t.x += t.vx;
          t.y += t.vy;

          ctx.fillStyle = t.color;
          ctx.fillRect(t.x - t.size / 2, t.y - t.size / 2, t.size, t.size);

          const dx = player.x - t.x;
          const dy = player.y - t.y;
          if (Math.sqrt(dx * dx + dy * dy) < (player.size / 2 + t.size / 2)) {
            running = false;
            hud.textContent = `CRASHED AT ${Math.floor(score)} // PRESS [ TO RETRY`;
            return;
          }

          if (t.x < -120 || t.x > width + 120 || t.y < -120 || t.y > height + 120) {
            threats.splice(i, 1);
          }
        }

        // Draw Player square
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(player.x - player.size / 2, player.y - player.size / 2, player.size, player.size);

        animId = requestAnimationFrame(loop);
      }
    </script>
  </body>
</html>
